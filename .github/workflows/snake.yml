name: Generate profile assets (snake + cards)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Codevena
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Render stats cards to static SVG
        run: |
          mkdir -p dist
          base="https://github-readme-stats-nine-henna-89.vercel.app"
          fetch() {
            curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 "$1" -o "dist/$2"
            grep -q "</svg>" "dist/$2" \
              || { echo "::error::dist/$2 is not a valid SVG — aborting so the last good card stays published"; exit 1; }
          }
          fetch "$base/api?username=Codevena&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true" stats.svg
          fetch "$base/api/top-langs/?username=Codevena&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" top-langs.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
